name: VPN Gate Node Check

on:
  # 每 30 分钟运行一次（UTC）；GitHub schedule 可能延迟启动。
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Get VPN Gate nodes, check through Cloudflare Worker, and build page
        run: |
          python vpngate.py
          python build_mihomo.py
        env:
          # 检测用的 Worker（独立于 Relay Worker，保持不变）
          CHECK_WORKER: 'https://vpnzhuzhai.cmos.de5.net/check?sstp=vpn:vpn@'
          # 改成新的 Relay Worker 域名；优先读取 GitHub 变量 EDT_DOMAIN
          EDT_DOMAIN: ${{ vars.EDT_DOMAIN || 'cmos969-app-01.cmosliu969.workers.dev' }}
          EDT_UUID: ${{ secrets.RELAY_UUID }}
          CHECK_CONCURRENCY: '32'
          CHECK_TIMEOUT: '90'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
