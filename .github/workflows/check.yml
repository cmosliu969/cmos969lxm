name: VPN Gate Node Check

on:
  # 每 30 分钟运行一次（UTC）；GitHub schedule 可能延迟启动。
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Get VPN Gate nodes, check through Cloudflare Worker, and build page
        run: python vpngate.py
        env:
          # 当前项目使用的已部署检测 Worker；这里是调用检测 API，不是部署 Worker。
          CHECK_WORKER: 'https://check.helei.kdns.fr/check?sstp=vpn:vpn@'
          CHECK_CONCURRENCY: '32'
          CHECK_TIMEOUT: '90'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
