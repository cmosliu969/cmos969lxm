name: Use Existing Healthy Worker

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID || 'ce287c6b1c33f1b67b243f34a116cbb4' }}
  TARGET_WORKER_NAME: super-bush-2e66
  TARGET_DOMAIN: super-bush-2e66.cmosliu969.workers.dev

jobs:
  use-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELAY_UUID: ${{ secrets.RELAY_UUID }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing secret CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$RELAY_UUID" || { echo '::error::Missing secret RELAY_UUID'; exit 1; }

      - name: Write minimal wrangler config
        run: |
          set -eu
          mkdir -p /tmp/existing-worker
          cat > /tmp/existing-worker/_worker.js <<'EOF'
          export default { async fetch() { return new Response('ok'); } };
          EOF
          cat > /tmp/existing-worker/wrangler.toml <<EOF
          name = "${TARGET_WORKER_NAME}"
          account_id = "${ACCOUNT_ID}"
          main = "_worker.js"
          compatibility_date = "2025-11-04"
          EOF

      - name: Update UUID using Worker Versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELAY_UUID: ${{ secrets.RELAY_UUID }}
        run: |
          set -euo pipefail
          npm install --global wrangler@4.156.0

          echo 'Creating a new Worker version with the updated UUID secret...'
          printf '%s' "$RELAY_UUID" | wrangler versions secret put UUID \
            --config /tmp/existing-worker/wrangler.toml \
            --message 'Rotate UUID for VPN subscription' \
            2>&1 | tee /tmp/versions-secret.log

          VERSION_ID=$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/versions-secret.log | tail -n 1 || true)

          if [ -z "$VERSION_ID" ]; then
            echo 'Version ID not found in Wrangler output; querying Cloudflare API...'
            VERSION_ID=$(curl -sS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${TARGET_WORKER_NAME}/versions?per_page=1" \
              | python3 -c 'import sys,json; j=json.load(sys.stdin); print(j["result"][0]["id"])')
          fi

          test -n "$VERSION_ID" || { echo '::error::Could not determine new Worker version ID'; exit 1; }
          echo "Deploying Worker version: $VERSION_ID"
          wrangler versions deploy "${VERSION_ID}@100%" \
            --config /tmp/existing-worker/wrangler.toml \
            --yes

      - name: Health check existing Worker
        run: |
          set -eu
          URL="https://${TARGET_DOMAIN}/"
          echo "Checking $URL"
          for i in $(seq 1 18); do
            STATUS=$(curl -sS -o /tmp/existing-health.body -w '%{http_code}' "$URL" || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = '200' ] && ! grep -qi 'error code: 1101' /tmp/existing-health.body; then
              echo 'Existing Worker is healthy.'
              echo
              echo 'Next: bind custom domain cmos969.cmos.de5.net to super-bush-2e66,'
              echo 'set GitHub variable EDT_DOMAIN to cmos969.cmos.de5.net,'
              echo 'then run VPN Gate Node Check and update the client subscription.'
              exit 0
            fi
            sleep 5
          done
          echo '::error::Existing Worker health check failed.'
          cat /tmp/existing-health.body || true
          exit 1
