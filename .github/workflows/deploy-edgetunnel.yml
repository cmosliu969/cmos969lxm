name: Deploy EdgeTunnel Worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-edgetunnel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure account workers.dev subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          ACCOUNT_ID='b45acc252ec8c5a10e80dd81f3d0f2a8'
          DESIRED_SUBDOMAIN='cmosliu969'
          API="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/subdomain"
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }

          CURRENT=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API")
          EXISTING=$(printf '%s' "$CURRENT" | jq -r '.result.subdomain // empty')
          if [ -n "$EXISTING" ]; then
            echo "Account workers.dev subdomain is already registered: $EXISTING"
            if [ "$EXISTING" != "$DESIRED_SUBDOMAIN" ]; then
              echo "::error::Update EDT_DOMAIN in check.yml to use ${EXISTING}.workers.dev, then rerun."
              exit 1
            fi
          else
            echo "Registering account workers.dev subdomain: $DESIRED_SUBDOMAIN"
            CREATED=$(curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "{\"subdomain\":\"$DESIRED_SUBDOMAIN\"}" "$API")
            OK=$(printf '%s' "$CREATED" | jq -r '.success // false')
            if [ "$OK" != 'true' ]; then
              echo '::error::Cloudflare could not register that workers.dev subdomain:'
              printf '%s' "$CREATED" | jq -r '.errors[]?.message // empty'
              exit 1
            fi
            echo "Registered: $(printf '%s' "$CREATED" | jq -r '.result.subdomain // empty').workers.dev"
          fi

      - name: Fetch pinned EdgeTunnel source and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          # Upstream cmliu/edgetunnel, pinned to a known commit (GPL-2.0).
          git init /tmp/edgetunnel
          git -C /tmp/edgetunnel remote add origin https://github.com/cmliu/edgetunnel.git
          git -C /tmp/edgetunnel fetch --depth=1 origin a8ab11125ece9bc27983f609a6359be81b21050c
          git -C /tmp/edgetunnel checkout FETCH_HEAD

          cat > /tmp/edgetunnel/wrangler.toml <<'TOML'
          name = "edgetunnel-cmos969"
          account_id = "b45acc252ec8c5a10e80dd81f3d0f2a8"
          main = "_worker.js"
          compatibility_date = "2025-11-04"
          workers_dev = true
          preview_urls = false

          [vars]
          UUID = "7581312a-844f-46d2-9a5e-3abd8fa868aa"
          TOML

          npm install --global wrangler@4
          wrangler deploy --config /tmp/edgetunnel/wrangler.toml
